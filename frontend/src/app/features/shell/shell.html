<!-- On desktop the page is exactly one screen tall: the header stays put and
     the sidebar and main area scroll on their own. -->
<div class="md:flex md:h-screen md:flex-col">
  <header class="shrink-0 border-b border-ink-200 bg-white">
    <!-- Phones: three columns (menu | logo | empty), so the logo sits in the true
         center. md and up: logo on the left, Log out on the right. -->
    <div
      class="grid grid-cols-[1fr_auto_1fr] items-center gap-4 px-4 py-4 sm:px-6 md:flex md:justify-between"
    >
      <button
        #menuButton
        class="-ml-2 inline-flex justify-self-start rounded-lg p-2 text-ink-700 hover:bg-ink-100 focus-visible:outline-2 focus-visible:outline-brand-500 md:hidden"
        type="button"
        aria-label="Open menu"
        aria-controls="sidebar"
        [attr.aria-expanded]="menuOpen()"
        (click)="openMenu()"
      >
        <svg lucideMenu size="24"></svg>
      </button>
      <a class="text-2xl font-bold tracking-tight text-brand-500" routerLink="/">JCash</a>
      <button
        class="btn-secondary hidden px-3 py-2 text-sm md:inline-flex"
        type="button"
        (click)="logout()"
      >
        Log out
      </button>
    </div>
  </header>

  <div class="md:flex md:min-h-0 md:flex-1">
    @if (menuOpen()) {
      <div
        class="fixed inset-0 z-30 bg-ink-950/40 md:hidden"
        aria-hidden="true"
        (click)="closeMenu()"
      ></div>
    }

    <!-- Phones: a fixed drawer, moved off-screen (and made invisible so its links
         can't be tabbed to) while closed. md and up: a normal sidebar column. -->
    <aside
      id="sidebar"
      class="fixed inset-y-0 left-0 z-40 flex w-72 max-w-[85vw] flex-col gap-6 overflow-y-auto bg-white px-5 py-6 shadow-xl transition-[translate,visibility] duration-200 md:static md:z-auto md:w-64 md:max-w-none md:shrink-0 md:translate-x-0 md:border-r md:border-ink-200 md:shadow-none md:transition-none"
      [class.max-md:-translate-x-full]="!menuOpen()"
      [class.max-md:invisible]="!menuOpen()"
    >
      <div class="flex items-start justify-between gap-4">
        <div class="min-w-0">
          <p class="text-sm text-ink-600">Hi,</p>
          <!-- truncate adds "…" if the name is too long; the title shows it in full on hover. -->
          <p
            class="truncate text-lg font-semibold text-ink-950"
            [title]="auth.currentUser()?.displayName ?? ''"
          >
            {{ auth.currentUser()?.displayName }}
          </p>
        </div>
        <button
          #closeButton
          class="-mr-2 inline-flex rounded-lg p-2 text-ink-700 hover:bg-ink-100 focus-visible:outline-2 focus-visible:outline-brand-500 md:hidden"
          type="button"
          aria-label="Close menu"
          (click)="closeMenu()"
        >
          <svg lucideX size="24"></svg>
        </button>
      </div>

      <nav aria-label="Main">
        <ul class="flex flex-col gap-2">
          @for (item of nav; track item.label) {
            <li>
              @if (item.path) {
                <a
                  class="nav-link"
                  [routerLink]="item.path"
                  routerLinkActive="nav-link-active"
                  ariaCurrentWhenActive="page"
                  (click)="closeMenu(false)"
                >
                  <svg class="shrink-0" [lucideIcon]="item.icon" size="20"></svg>
                  {{ item.label }}
                </a>
              } @else {
                <span
                  class="nav-link cursor-default text-ink-400 hover:bg-transparent"
                  aria-disabled="true"
                >
                  <svg class="shrink-0" [lucideIcon]="item.icon" size="20"></svg>
                  {{ item.label }}
                </span>
              }
            </li>
          }
        </ul>
      </nav>

      <button class="btn-secondary mt-auto w-full md:hidden" type="button" (click)="logout()">
        Log out
      </button>
    </aside>

    <main class="min-w-0 flex-1 px-4 py-6 sm:px-6 md:overflow-y-auto md:py-8">
      <div class="mx-auto max-w-4xl">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
