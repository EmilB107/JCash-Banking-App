<app-auth-layout heading="Log in to your wallet">
  <form class="mt-6 space-y-4" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (error(); as message) {
      <div class="alert-error" role="alert">{{ message }}</div>
    }

    <div>
      <label class="form-label" for="identifier">Email or mobile number</label>
      <input
        id="identifier"
        class="form-input"
        type="text"
        autocomplete="username"
        placeholder="you@example.com or 0917 123 4567"
        formControlName="identifier"
        appMobileFormat
        [attr.aria-invalid]="invalid('identifier')"
        [attr.aria-describedby]="invalid('identifier') ? 'identifier-error' : null"
      />
      @if (invalid('identifier')) {
        <p id="identifier-error" class="form-error">Enter your email or mobile number.</p>
      }
    </div>

    <div>
      <label class="form-label" for="pin">PIN</label>
      <app-pin-field label="PIN">
        <input
          id="pin"
          class="form-input pr-10 tracking-widest"
          type="password"
          inputmode="numeric"
          maxlength="6"
          autocomplete="current-password"
          formControlName="pin"
          [attr.aria-invalid]="invalid('pin')"
          [attr.aria-describedby]="invalid('pin') ? 'pin-error' : null"
        />
      </app-pin-field>
      @if (invalid('pin')) {
        <p id="pin-error" class="form-error">Enter your 6-digit PIN.</p>
      }
    </div>

    <button class="btn-primary w-full" type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Logging in…' : 'Log in' }}
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-ink-600">
    New to JCash? <a class="link" routerLink="/register">Create an account</a>
  </p>
</app-auth-layout>
