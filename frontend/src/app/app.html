<!-- role="status" stays mounted so screen readers announce the message when it appears. -->
<div role="status">
  @if (showWakeNotice()) {
    <p
      class="fixed inset-x-4 bottom-4 z-50 mx-auto max-w-md rounded-lg bg-ink-900 px-4 py-3 text-center text-sm text-white shadow-lg"
    >
      Still working. The free demo server may be waking up, which can take about a minute.
    </p>
  }
</div>
