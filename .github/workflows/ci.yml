# Runs the backend and frontend tests on every push and pull request to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    # A throwaway PostgreSQL for the database tests; only exists during this job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jcash_banking_user
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: jcash_banking_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jcash_banking_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_PASSWORD: ci-password
      ACTUATOR_USERNAME: ci
      ACTUATOR_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # The integration tests use a separate database (see docs/testing.md).
      - name: Create test database
        run: psql -h localhost -U jcash_banking_user -d jcash_banking_db -c "CREATE DATABASE jcash_banking_test_db"
        env:
          PGPASSWORD: ci-password
      - name: Test
        run: ./mvnw -B test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npm run build
