spring.application.name=jcash-banking

# PostgreSQL database connection
# ${NAME:default} reads the environment variable NAME and falls back to the
# value after the colon, so local development needs only DB_PASSWORD while the
# deployed backend sets DB_URL and DB_USERNAME to the hosted database.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jcash_banking_db}
spring.datasource.username=${DB_USERNAME:jcash_banking_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP); see docs/performance-tuning.md
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=jcash-pool
# Keep retrying the first connection for up to 60 s instead of failing at once.
# On a slow host (Render's free plan) the first encrypted connection can take so
# long that the database gives up; later attempts are faster because Java has
# already loaded its TLS code.
spring.datasource.hikari.initialization-fail-timeout=60000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Database migrations
spring.flyway.enabled=true
# OpenAPI / Swagger UI: send the XSRF-TOKEN cookie back as a header on "try it" requests
springdoc.swagger-ui.csrf.enabled=true

# Hosts like Render choose the port and pass it in PORT; locally it's 8080.
server.port=${PORT:8080}
# Render (and later Vercel) receive HTTPS and forward it to the app as plain
# HTTP with X-Forwarded-* headers. Reading those headers tells Spring the
# original request was HTTPS, so the session and CSRF cookies are marked Secure.
server.forward-headers-strategy=framework

# Embedded Tomcat; see docs/performance-tuning.md
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.connection-timeout=10s
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1KB

# Monitoring (Spring Boot Actuator): health is public with details hidden;
# everything else needs the operator account (HTTP Basic), which is separate
# from app users. See ActuatorSecurityConfiguration.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ACTUATOR
jcash.actuator.username=${ACTUATOR_USERNAME}
jcash.actuator.password=${ACTUATOR_PASSWORD}
