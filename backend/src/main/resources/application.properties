spring.application.name=jcash-banking

# PostgreSQL database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/jcash_banking_db
spring.datasource.username=jcash_banking_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP); see docs/performance-tuning.md
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=jcash-pool

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Database migrations
spring.flyway.enabled=true
# OpenAPI / Swagger UI: send the XSRF-TOKEN cookie back as a header on "try it" requests
springdoc.swagger-ui.csrf.enabled=true

# Embedded Tomcat; see docs/performance-tuning.md
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.connection-timeout=10s
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1KB

# Monitoring (Spring Boot Actuator): health is public with details hidden;
# everything else needs the operator account (HTTP Basic), which is separate
# from app users. See ActuatorSecurityConfiguration.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ACTUATOR
jcash.actuator.username=${ACTUATOR_USERNAME}
jcash.actuator.password=${ACTUATOR_PASSWORD}
